<!DOCTYPE html>
  <html lang="pt-BR">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>App Financas</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
      <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
          margin: 0;
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
          background: #f5f5f5;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          line-height: 1.5;
        }

        button, input, select, textarea, table {
          font: inherit;
        }

        button, select, input[type="checkbox"] {
          touch-action: manipulation;
        }

        /* O usuário já aparece no topo direito. Mantemos um único ponto de perfil/logout. */
        .sidebar-footer {
          display: none !important;
        }

        /*
         * Modo notebook: quando a altura útil é menor, o app reduz espaços
         * verticais e deixa a área principal usar o viewport inteiro.
         * Não esconde header/sidebar e não depende de zoom do navegador.
         */
        @media (min-width: 768px) and (max-height: 900px) {
          body {
            overflow: hidden;
          }

          .app-layout,
          .app-content {
            height: 100vh !important;
            min-height: 100vh !important;
          }

          .app-content {
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
          }

          .top-header {
            flex: 0 0 auto;
            padding: 10px 18px !important;
            min-height: 0 !important;
          }

          .top-header h1 {
            font-size: 19px !important;
            margin-bottom: 1px !important;
          }

          .top-header p {
            font-size: 12px !important;
          }

          .page-container {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            width: 100% !important;
            max-width: 1280px !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            padding: 12px 16px 16px !important;
            scrollbar-gutter: stable;
          }

          .page-header {
            padding: 14px 18px !important;
            margin-bottom: 12px !important;
            border-radius: 10px !important;
          }

          .page-header-breadcrumb {
            margin-bottom: 6px !important;
          }

          .page-header-icon {
            font-size: 23px !important;
          }

          .page-header h1 {
            font-size: 19px !important;
          }

          .page-header p {
            font-size: 12px !important;
            margin-top: 2px !important;
          }

          .breadcrumb {
            margin-bottom: 8px !important;
          }

          .content-card {
            padding: 16px !important;
          }

          .filter-card {
            padding: 14px !important;
            margin-bottom: 12px !important;
          }

          .filter-grid {
            gap: 10px !important;
          }

          .kpi-card {
            padding: 12px 14px !important;
          }

          .kpi-card > p:nth-of-type(2) {
            font-size: 19px !important;
          }

          .chart-card {
            padding: 14px !important;
          }

          .chart-card h3 {
            margin-bottom: 10px !important;
          }

          .admin-tabs {
            margin-bottom: 12px !important;
            gap: 12px !important;
          }

          .admin-tabs button {
            padding: 8px 4px !important;
          }

          .sidebar {
            padding: 12px 10px !important;
          }

          .sidebar-brand {
            font-size: 18px !important;
          }

          .sidebar-sep {
            margin: 10px 6px !important;
          }

          .sidebar nav {
            gap: 4px !important;
          }

          .sidebar-item {
            padding: 8px 10px !important;
            font-size: 14px !important;
          }

          .transactions-table th,
          .transactions-table td {
            padding-top: 6px !important;
            padding-bottom: 6px !important;
          }
        }

        @media (min-width: 768px) and (max-height: 760px) {
          .top-header {
            padding-top: 8px !important;
            padding-bottom: 8px !important;
          }

          .page-container {
            padding-top: 9px !important;
          }

          .page-header {
            padding: 11px 15px !important;
            margin-bottom: 9px !important;
          }

          .page-header-breadcrumb,
          .page-header p {
            display: none;
          }

          .filter-card {
            padding: 11px !important;
          }

          .admin-tabs button {
            padding-top: 6px !important;
            padding-bottom: 6px !important;
          }
        }

        @media (max-width: 640px) {
          body {
            overflow-x: hidden;
          }

          button, input, select, textarea {
            font-size: 16px !important;
          }

          button, select, input:not([type="checkbox"]), textarea {
            min-height: 44px;
          }

          table {
            font-size: 12px !important;
          }

          th, td {
            padding: 8px !important;
          }

          .app-shell-header {
            padding: 16px !important;
            align-items: flex-start !important;
            flex-direction: column !important;
            gap: 14px !important;
          }

          .app-shell-header h1 {
            font-size: 24px !important;
            line-height: 1.15 !important;
          }

          .app-header-actions, .dashboard-actions, .section-title-row {
            width: 100% !important;
            display: grid !important;
            grid-template-columns: 1fr !important;
          }

          .app-header-actions button, .dashboard-actions button, .section-title-row button {
            width: 100% !important;
          }

          .page-container {
            padding: 12px !important;
          }

          .content-card, .login-card {
            padding: 18px !important;
            border-radius: 14px !important;
          }

          .login-card {
            width: calc(100% - 24px) !important;
          }

          .chart-card {
            padding: 16px !important;
          }

          .table-scroll {
            margin-left: -8px;
            margin-right: -8px;
            border-radius: 10px !important;
            -webkit-overflow-scrolling: touch;
          }
        }
      </style>
    </head>
    <body>
      <div id="root"></div>
      <script type="module" src="/main.jsx"></script>
    </body>
  </html>
