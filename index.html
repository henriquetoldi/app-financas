<!DOCTYPE html>
  <html lang="pt-BR">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>App Financas</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
      <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
          margin: 0;
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
          background: #f5f5f5;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          line-height: 1.5;
        }

        button, input, select, textarea, table {
          font: inherit;
        }

        button, select, input[type="checkbox"] {
          touch-action: manipulation;
        }

        @media (max-width: 640px) {
          body {
            overflow-x: hidden;
          }

          button, input, select, textarea {
            font-size: 16px !important;
          }

          button, select, input:not([type="checkbox"]), textarea {
            min-height: 44px;
          }

          table {
            font-size: 12px !important;
          }

          th, td {
            padding: 8px !important;
          }

          .app-shell-header {
            padding: 16px !important;
            align-items: flex-start !important;
            flex-direction: column !important;
            gap: 14px !important;
          }

          .app-shell-header h1 {
            font-size: 24px !important;
            line-height: 1.15 !important;
          }

          .app-header-actions, .dashboard-actions, .section-title-row {
            width: 100% !important;
            display: grid !important;
            grid-template-columns: 1fr !important;
          }

          .app-header-actions button, .dashboard-actions button, .section-title-row button {
            width: 100% !important;
          }

          .page-container {
            padding: 12px !important;
          }

          .content-card, .login-card {
            padding: 18px !important;
            border-radius: 14px !important;
          }

          .login-card {
            width: calc(100% - 24px) !important;
          }

          .chart-card {
            padding: 16px !important;
          }

          .table-scroll {
            margin-left: -8px;
            margin-right: -8px;
            border-radius: 10px !important;
            -webkit-overflow-scrolling: touch;
          }
        }
      </style>
    </head>
    <body>
      <div id="root"></div>
      <script type="module" src="/main.jsx"></script>
      <script defer src="/compras-programadas.js"></script>
      <script defer src="/compras-programadas-nav.js"></script>
      <script defer src="/compras-programadas-categorias.js"></script>
      <script defer src="/compras-programadas-tipo-categoria.js"></script>
    </body>
  </html>
