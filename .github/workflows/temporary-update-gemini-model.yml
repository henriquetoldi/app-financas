name: Temporary update Gemini model

on:
  push:
    branches:
      - fix/assistente-modelo-gemini-atual

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assistente-modelo-gemini-atual
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Gemini model update
        run: node scripts/temporary-update-gemini-model.js
      - name: Validate backend syntax
        run: node --check backend-server.js
      - name: Build frontend
        run: npm run build
      - name: Validate diff
        run: git diff --check
      - name: Validate Gemini model guardrails
        run: |
          grep -q "gemini-3.1-flash-lite" backend-server.js
          grep -q "GEMINI_MODELO_INDISPONIVEL" backend-server.js
          grep -q "tentando fallback compatível" backend-server.js
          ! grep -q "temperature: 0.2" backend-server.js
      - name: Remove temporary files and commit result
        run: |
          rm scripts/temporary-update-gemini-model.js
          rm .github/workflows/temporary-update-gemini-model.yml
          git config user.name "henriquetoldi"
          git config user.email "henriquetoldi@gmail.com"
          git add backend-server.js scripts/temporary-update-gemini-model.js .github/workflows/temporary-update-gemini-model.yml
          git commit -m "Atualizar modelo Gemini do Assistente" || true
          git push origin HEAD:fix/assistente-modelo-gemini-atual
