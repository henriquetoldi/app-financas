name: Assistente alterar compras programadas

on:
  pull_request:
    branches:
      - main

concurrency:
  group: assistente-alterar-compras
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/assistente-alterar-compras
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply feature when needed
        run: |
          if grep -q "async function ferramentaPrepararAlteracaoCompraProgramada" backend-server.js; then
            echo "Feature already applied."
          else
            node changes/apply-assistente-alterar-compras.mjs
          fi

      - name: Validate backend syntax
        run: node --check backend-server.js

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run safety and integration assertions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const backend = fs.readFileSync('backend-server.js', 'utf8');
          const app = fs.readFileSync('App.jsx', 'utf8');

          const requiredBackend = [
            'async function ferramentaPrepararAlteracaoCompraProgramada(usuarioId, args = {})',
            "name: 'preparar_alteracao_compra_programada'",
            "preparar_alteracao_compra_programada: 'alteração de compra programada'",
            "if (nome === 'preparar_alteracao_compra_programada') return ferramentaPrepararAlteracaoCompraProgramada(usuarioId, args);",
            "tipo: 'ALTERAR_COMPRA_PROGRAMADA'",
            'const resultadoBruto = await executarFerramentaAssistente',
            'delete resultado._acaoPendente',
            "status IN ('PLANEJADA', 'ADIADA')",
          ];
          for (const trecho of requiredBackend) {
            if (!backend.includes(trecho)) throw new Error(`Backend sem trecho obrigatório: ${trecho}`);
          }

          const inicioFerramenta = backend.indexOf('async function ferramentaPrepararAlteracaoCompraProgramada');
          const fimFerramenta = backend.indexOf('const FERRAMENTAS_ASSISTENTE = [', inicioFerramenta);
          const ferramenta = backend.slice(inicioFerramenta, fimFerramenta);
          if (/\bINSERT\s+INTO\b/i.test(ferramenta) || /\bUPDATE\s+compras_programadas\b/i.test(ferramenta) || /\bDELETE\s+FROM\s+compras_programadas\b/i.test(ferramenta)) {
            throw new Error('A ferramenta de alteração não pode gravar no banco.');
          }
          if (!ferramenta.includes("acao === 'ADIAR'")) throw new Error('Ferramenta sem fluxo de adiamento.');
          if (!ferramenta.includes("acao === 'EDITAR'")) throw new Error('Ferramenta sem fluxo de edição.');
          if (!ferramenta.includes("acao === 'MARCAR_COMPRADA'")) throw new Error('Ferramenta sem fluxo de compra concluída.');
          if (!ferramenta.includes("acao === 'CANCELAR'")) throw new Error('Ferramenta sem fluxo de cancelamento.');

          const requiredApp = [
            'const confirmarAlteracaoSugerida = (acao, indice) => {',
            "mensagem.acaoPendente?.tipo === 'ALTERAR_COMPRA_PROGRAMADA'",
            'axios.patch(`${API_URL}/compras-programadas/${acao.compraId}`, acao.payload',
            'pedirConfirmacao(',
            '✅ Alteração aplicada',
          ];
          for (const trecho of requiredApp) {
            if (!app.includes(trecho)) throw new Error(`Frontend sem trecho obrigatório: ${trecho}`);
          }
          const inicioConfirmacao = app.indexOf('const confirmarAlteracaoSugerida');
          const fimConfirmacao = app.indexOf('  return (', inicioConfirmacao);
          const confirmacao = app.slice(inicioConfirmacao, fimConfirmacao);
          if (!confirmacao.includes('pedirConfirmacao(')) throw new Error('Alteração assistida não exige confirmação explícita.');
          if (!confirmacao.includes('axios.patch(')) throw new Error('Alteração confirmada não reutiliza o PATCH nativo.');

          console.log('Assertions de alteração assistida aprovadas.');
          NODE

      - name: Check diff
        run: |
          git diff --check
          git diff --check origin/main...HEAD

      - name: Commit validated feature
        run: |
          if git diff --quiet; then
            echo "No working tree changes to commit."
          else
            git add App.jsx backend-server.js
            git commit -m "Permitir alterar compras pelo assistente com confirmação"
            git pull --rebase origin feat/assistente-alterar-compras
            git push origin feat/assistente-alterar-compras
          fi
