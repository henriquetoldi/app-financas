name: Temporary Gemini tool schema hotfix

on:
  push:
    branches:
      - fix/assistente-gemini-tool-schema-v2
    paths:
      - scripts/temporary-fix-gemini-tool-schema.js
      - .github/workflows/temporary-fix-gemini-tool-schema.yml

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply hotfix
        run: node scripts/temporary-fix-gemini-tool-schema.js

      - name: Validate backend syntax
        run: node --check backend-server.js

      - name: Build frontend
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Validate Gemini schema guardrails
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('backend-server.js', 'utf8');
          const start = text.indexOf('function declaracoesGeminiAssistente(nomesPermitidos = null)');
          const end = text.indexOf('function extrairTextoRespostaAssistente', start);
          if (start < 0 || end < 0) throw new Error('Gerador de declarações não encontrado.');
          const body = text.slice(start, end);
          if (!body.includes(".filter(({ name }) => !filtro || filtro.has(name))")) throw new Error('Filtro por allowedFunctionNames ausente.');
          if (!body.includes('if (propriedades.length > 0) declaracao.parameters = parameters;')) throw new Error('Omissão de parameters vazio ausente.');
          if (!text.includes("const nomesPermitidos = toolConfig?.functionCallingConfig?.allowedFunctionNames || null;")) throw new Error('Chamada Gemini não filtra ferramentas roteadas.');
          if (!text.includes("codigo: 'GEMINI_REQUISICAO_INVALIDA'")) throw new Error('Erro 400 ainda não tem diagnóstico seguro.');
          console.log('Guardrails Gemini OK');
          NODE

      - name: Remove temporary files and commit result
        run: |
          rm -f scripts/temporary-fix-gemini-tool-schema.js .github/workflows/temporary-fix-gemini-tool-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-server.js scripts/temporary-fix-gemini-tool-schema.js .github/workflows/temporary-fix-gemini-tool-schema.yml
          git commit -m "Corrigir schema de ferramentas do Assistente Gemini"
          git push
