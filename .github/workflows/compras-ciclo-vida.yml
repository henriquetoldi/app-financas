name: Compras programadas ciclo de vida

on:
  push:
    branches:
      - feat/compras-programadas-ciclo-vida
    paths:
      - App.jsx
      - .github/workflows/compras-ciclo-vida.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/compras-programadas-ciclo-vida
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run lifecycle assertions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = fs.readFileSync('App.jsx', 'utf8');
          const required = [
            "const [filtroStatusCompra, setFiltroStatusCompra] = useState('ATIVAS')",
            'const atualizarStatusCompra = async',
            '<option value="COMPRADA">Comprada</option>',
            '<option value="CANCELADA">Cancelada</option>',
            'comprasFiltradas.map',
            'Compras concluídas',
            'className="compras-item-card"',
            '.compras-item-card { grid-template-columns: 1fr !important; }',
          ];
          for (const trecho of required) {
            if (!app.includes(trecho)) throw new Error(`Trecho obrigatório ausente: ${trecho}`);
          }
          if (app.includes('{compras.map((compra) => {')) throw new Error('Lista ainda ignora filtro de status.');
          console.log('Assertions do ciclo de vida aprovadas.');
          NODE

      - name: Check branch diff
        run: git diff --check origin/main...HEAD
