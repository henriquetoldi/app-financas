name: Refinar formulario de Compras Programadas

on:
  push:
    branches:
      - style/compras-programadas-form

permissions:
  contents: write

jobs:
  aplicar-e-validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar refinamento visual
        run: python .github/scripts/refinar_form_compras.py

      - name: Instalar dependencias
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar diff
        run: git diff --check

      - name: Remover arquivos temporarios
        run: |
          rm .github/scripts/refinar_form_compras.py
          rm .github/workflows/refinar-form-compras.yml

      - name: Garantir escopo somente no App.jsx
        run: |
          changed="$(git status --short | awk '{print $2}' | grep -v '^\.github/' || true)"
          test "$changed" = "App.jsx"

      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx .github/scripts/refinar_form_compras.py .github/workflows/refinar-form-compras.yml
          git commit -m "Refinar layout do formulario de Compras Programadas"
          git push
