name: Fix credit card payments

on:
  push:
    branches:
      - fix/pagamentos-cartao-transferencia-interna

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pagamentos-cartao-transferencia-interna

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar correção de pagamentos de cartão
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend-server.js')
          text = path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 ocorrência, encontrado {count}')
              return source.replace(old, new, 1)

          def replace_in_section(source, start_marker, end_marker, old, new, label):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              section = source[start:end]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 ocorrência na seção, encontrado {count}')
              section = section.replace(old, new, 1)
              return source[:start] + section + source[end:]

          transfer_marker = """function descricaoIndicaTransferencia(descricao) {
            return /\\b(PIX|TRANSFERENCIA|TRANSFERÊNCIA|TED|DOC|ENVIO|ENVIADO|RECEBIDA|RECEBIDO|ENTRE CONTAS)\\b/i.test(String(descricao || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, ''));
          }
          """
          helpers = transfer_marker + """
          function descricaoIndicaPagamentoCartao(descricao) {
            const texto = String(descricao || '')
              .normalize('NFD')
              .replace(/[\\u0300-\\u036f]/g, '')
              .toUpperCase()
              .replace(/[^A-Z0-9\\s]/g, ' ')
              .replace(/\\s+/g, ' ')
              .trim();

            if (/\\bPAGAMENTO\\s+(RECEBIDO|DE\\s+FATURA|DA\\s+FATURA|FATURA)\\b/.test(texto)) return true;
            return /\\bPAGAMENTO\\s+EM\\s+\\d{1,2}\\s+(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\\b/.test(texto);
          }

          function contaEhCartao(conta) {
            return String(conta?.conta_tipo || conta?.tipo || '').trim().toUpperCase() === 'CREDIT_CARD';
          }

          async function conciliarPagamentosCartaoImportados(usuarioId, transacaoIds = []) {
            const ids = [...new Set((transacaoIds || [])
              .map((id) => String(id || '').trim())
              .filter((id) => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)))];
            if (ids.length === 0) return { pareadas: 0, ambiguas: 0, semContrapartida: 0 };

            const importadas = new Set(ids);
            const intervaloResult = await pool.query(
              `SELECT MIN(t.data) AS data_inicial, MAX(t.data) AS data_final
               FROM transacoes t
               JOIN contas c ON c.id = t.conta_id
               WHERE c.usuario_id = $1
                 AND t.id = ANY($2::uuid[])
                 AND t.deletado_em IS NULL`,
              [usuarioId, ids]
            );
            const dataInicial = intervaloResult.rows[0]?.data_inicial;
            const dataFinal = intervaloResult.rows[0]?.data_final;
            if (!dataInicial || !dataFinal) return { pareadas: 0, ambiguas: 0, semContrapartida: 0 };

            const pagamentosResult = await pool.query(
              `SELECT t.id, t.data, t.descricao, t.valor, t.tipo, t.conta_id,
                      c.nome AS conta_nome, c.tipo AS conta_tipo
               FROM transacoes t
               JOIN contas c ON c.id = t.conta_id
               WHERE c.usuario_id = $1
                 AND c.tipo = 'CREDIT_CARD'
                 AND t.tipo = 'CREDITO'
                 AND t.data BETWEEN $2::date AND $3::date
                 AND t.deletado_em IS NULL
                 AND COALESCE(t.eh_transferencia_interna, false) = false
               ORDER BY t.data ASC, t.criado_em ASC, t.id ASC`,
              [usuarioId, dataInicial, dataFinal]
            );

            let pareadas = 0;
            let ambiguas = 0;
            let semContrapartida = 0;

            for (const pagamento of pagamentosResult.rows) {
              if (!descricaoIndicaPagamentoCartao(pagamento.descricao)) continue;

              const candidatosResult = await pool.query(
                `SELECT t.id, t.data, t.descricao, t.valor, t.tipo, t.conta_id,
                        c.nome AS conta_nome, c.tipo AS conta_tipo
                 FROM transacoes t
                 JOIN contas c ON c.id = t.conta_id
                 WHERE c.usuario_id = $1
                   AND c.tipo <> 'CREDIT_CARD'
                   AND t.tipo = 'DEBITO'
                   AND t.data = $2::date
                   AND ABS(ABS(t.valor) - ABS($3::numeric)) <= 0.01
                   AND t.deletado_em IS NULL
                   AND COALESCE(t.eh_transferencia_interna, false) = false
                 ORDER BY t.criado_em ASC, t.id ASC`,
                [usuarioId, pagamento.data, pagamento.valor]
              );

              let candidatos = candidatosResult.rows;
              if (!importadas.has(String(pagamento.id))) {
                candidatos = candidatos.filter((tx) => importadas.has(String(tx.id)));
              }

              if (candidatos.length === 0) {
                if (importadas.has(String(pagamento.id))) semContrapartida++;
                continue;
              }

              const pontuar = (tx) => descricaoIndicaPagamentoCartao(tx.descricao)
                ? 3
                : descricaoIndicaTransferencia(tx.descricao) ? 2 : 1;
              const maiorPontuacao = Math.max(...candidatos.map(pontuar));
              const melhores = candidatos.filter((tx) => pontuar(tx) === maiorPontuacao);
              if (melhores.length !== 1) {
                ambiguas++;
                continue;
              }

              const debito = melhores[0];
              const client = await pool.connect();
              try {
                await client.query('BEGIN');
                const bloqueadas = await client.query(
                  `SELECT t.id
                   FROM transacoes t
                   JOIN contas c ON c.id = t.conta_id
                   WHERE c.usuario_id = $1
                     AND t.id = ANY($2::uuid[])
                     AND t.deletado_em IS NULL
                     AND COALESCE(t.eh_transferencia_interna, false) = false
                   FOR UPDATE OF t`,
                  [usuarioId, [debito.id, pagamento.id]]
                );

                if (bloqueadas.rows.length !== 2) {
                  await client.query('ROLLBACK');
                  continue;
                }

                const grupoId = crypto.randomUUID();
                const atualizadas = await client.query(
                  `UPDATE transacoes
                   SET eh_transferencia_interna = true,
                       transferencia_grupo_id = $1,
                       atualizado_em = NOW()
                   WHERE id = ANY($2::uuid[])
                   RETURNING id`,
                  [grupoId, [debito.id, pagamento.id]]
                );

                if (atualizadas.rows.length !== 2) {
                  await client.query('ROLLBACK');
                  continue;
                }

                await client.query('COMMIT');
                pareadas++;
              } catch (error) {
                await client.query('ROLLBACK');
                throw error;
              } finally {
                client.release();
              }
            }

            return { pareadas, ambiguas, semContrapartida };
          }
          """
          text = replace_once(text, transfer_marker, helpers, 'helpers de pagamento de cartão')

          text = replace_once(text, "    conta_nome: tx.conta_nome,\n    descricao: tx.descricao,", "    conta_nome: tx.conta_nome,\n    conta_tipo: tx.conta_tipo || null,\n    descricao: tx.descricao,", 'conta_tipo no resumo de transferência')

          text = replace_in_section(text, 'async function buscarTransacoesUsuario(usuarioId, filtros = {}) {', "app.get('/api/transacoes', verificarToken", '            conta.nome AS conta_nome,\n            cat.nome AS categoria_nome,', '            conta.nome AS conta_nome,\n            conta.tipo AS conta_tipo,\n            cat.nome AS categoria_nome,', 'conta_tipo no SELECT principal')

          text = replace_in_section(text, "app.get('/api/transferencias-internas/sugestoes'", "app.post('/api/transferencias-internas/marcar'", "    const creditos = candidatas.filter((tx) => tx.tipo === 'CREDITO');", "    const creditos = candidatas\n      .filter((tx) => tx.tipo === 'CREDITO')\n      .sort((a, b) => Number(contaEhCartao(b) && descricaoIndicaPagamentoCartao(b.descricao)) - Number(contaEhCartao(a) && descricaoIndicaPagamentoCartao(a.descricao)));", 'priorização de créditos de pagamento de cartão')

          text = replace_in_section(text, "app.get('/api/transferencias-internas/sugestoes'", "app.post('/api/transferencias-internas/marcar'", "        const descricaoTransferencia = descricaoIndicaTransferencia(debito.descricao) || descricaoIndicaTransferencia(credito.descricao);\n        if (descricaoTransferencia) motivos.push('Descrição contém Pix/transferência');\n        const confianca = dias === 0 && descricaoTransferencia ? 'alta' : descricaoTransferencia ? 'média' : 'baixa';", "        const pagamentoCartao = contaEhCartao(credito) && descricaoIndicaPagamentoCartao(credito.descricao);\n        const descricaoTransferencia = descricaoIndicaTransferencia(debito.descricao) || descricaoIndicaTransferencia(credito.descricao);\n        if (pagamentoCartao) motivos.push('Pagamento de fatura do cartão');\n        if (descricaoTransferencia) motivos.push('Descrição contém Pix/transferência');\n        const confianca = pagamentoCartao\n          ? (dias === 0 ? 'alta' : 'média')\n          : dias === 0 && descricaoTransferencia ? 'alta' : descricaoTransferencia ? 'média' : 'baixa';", 'confiança de pagamento de cartão')

          text = replace_in_section(text, "app.post('/api/importar/:arquivoId'", "app.get('/api/notificacoes'", "            tipo = valor < 0 ? 'DEBITO' : 'CREDITO';", "            tipo = valor < 0 ? 'CREDITO' : 'DEBITO';", 'sinal de cartão no importador do Drive')
          text = replace_in_section(text, "app.post('/api/importar/:arquivoId'", "app.get('/api/notificacoes'", "        let inseridas = 0, duplicadas = 0;", "        let inseridas = 0, duplicadas = 0;\n        const transacoesImportadasIds = [];", 'IDs importados no Drive')
          text = replace_in_section(text, "app.post('/api/importar/:arquivoId'", "app.get('/api/notificacoes'", "          const regra = await buscarRegraCompatível(req.usuario.usuario_id, tx.descricao);\n\n          await pool.query(", "          const regra = await buscarRegraCompatível(req.usuario.usuario_id, tx.descricao);\n          const transacaoId = crypto.randomUUID();\n\n          await pool.query(", 'UUID explícito no importador do Drive')
          text = replace_in_section(text, "app.post('/api/importar/:arquivoId'", "app.get('/api/notificacoes'", "              crypto.randomUUID(),\n              contaId,", "              transacaoId,\n              contaId,", 'uso do UUID explícito no Drive')
          text = replace_in_section(text, "app.post('/api/importar/:arquivoId'", "app.get('/api/notificacoes'", "          inseridas++;\n        }\n\n        res.json({", "          inseridas++;\n          transacoesImportadasIds.push(transacaoId);\n        }\n\n        const pagamentosCartao = await conciliarPagamentosCartaoImportados(req.usuario.usuario_id, transacoesImportadasIds);\n\n        res.json({", 'conciliação após importação do Drive')
          text = replace_in_section(text, "app.post('/api/importar/:arquivoId'", "app.get('/api/notificacoes'", "          duplicadas,\n          total: transacoes.length", "          duplicadas,\n          pagamentosCartaoPareados: pagamentosCartao.pareadas,\n          total: transacoes.length", 'resposta do Drive')

          text = replace_in_section(text, "app.post('/api/importacoes/xlsx/confirmar'", "app.post('/api/importar', verificarToken", "    const transacaoPorTempId = new Map();", "    const transacaoPorTempId = new Map();\n    const transacoesImportadasIds = new Set();", 'IDs importados no confirmar XLSX')
          text = replace_in_section(text, "app.post('/api/importacoes/xlsx/confirmar'", "app.post('/api/importar', verificarToken", "            transacaoPorTempId.set(tx.hash_transacao || hash, transacaoInseridaId);", "            transacaoPorTempId.set(tx.hash_transacao || hash, transacaoInseridaId);\n            transacoesImportadasIds.add(transacaoInseridaId);", 'nova transação no conjunto XLSX')
          text = replace_in_section(text, "app.post('/api/importacoes/xlsx/confirmar'", "app.post('/api/importar', verificarToken", "        if (await atualizarTransacaoImportacao(req.usuario.usuario_id, { ...txComConta, transacaoId: existente.id })) atualizadas++;", "        if (await atualizarTransacaoImportacao(req.usuario.usuario_id, { ...txComConta, transacaoId: existente.id })) {\n          atualizadas++;\n          transacoesImportadasIds.add(existente.id);\n        }", 'transação atualizada no conjunto XLSX')
          text = replace_in_section(text, "app.post('/api/importacoes/xlsx/confirmar'", "app.post('/api/importar', verificarToken", "    let conciliacoesAplicadas = 0;", "    const pagamentosCartao = await conciliarPagamentosCartaoImportados(req.usuario.usuario_id, [...transacoesImportadasIds]);\n\n    let conciliacoesAplicadas = 0;", 'conciliação pós XLSX')
          text = replace_in_section(text, "app.post('/api/importacoes/xlsx/confirmar'", "app.post('/api/importar', verificarToken", "      conciliacoesAplicadas,\n      erros: preview.erros.length,", "      conciliacoesAplicadas,\n      pagamentosCartaoPareados: pagamentosCartao.pareadas,\n      erros: preview.erros.length,", 'resposta XLSX')

          text = replace_in_section(text, "app.post('/api/importar', verificarToken", "app.get('/api/notificacoes'", "    let duplicadas = 0;\n\n    for (const tx of transacoesValidadas) {", "    let duplicadas = 0;\n    const transacoesImportadasIds = [];\n\n    for (const tx of transacoesValidadas) {", 'IDs importados na rota legada')
          text = replace_in_section(text, "app.post('/api/importar', verificarToken", "app.get('/api/notificacoes'", "      } else {\n        inseridas++;\n      }\n    }\n\n    const arquivoHash", "      } else {\n        inseridas++;\n        transacoesImportadasIds.push(insert.rows[0].id);\n      }\n    }\n\n    const pagamentosCartao = await conciliarPagamentosCartaoImportados(req.usuario.usuario_id, transacoesImportadasIds);\n\n    const arquivoHash", 'conciliação na rota legada')
          text = replace_in_section(text, "app.post('/api/importar', verificarToken", "app.get('/api/notificacoes'", "      duplicadas,\n      total: transacoesValidadas.length,", "      duplicadas,\n      pagamentosCartaoPareados: pagamentosCartao.pareadas,\n      total: transacoesValidadas.length,", 'resposta da rota legada')

          path.write_text(text)
          PY

      - name: Validar sintaxe do backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar diff
        run: git diff --check

      - name: Guardrails de pagamentos de cartão
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend-server.js').read_text()
          assert 'function descricaoIndicaPagamentoCartao' in text
          assert 'async function conciliarPagamentosCartaoImportados' in text
          assert "c.tipo = 'CREDIT_CARD'" in text
          assert "c.tipo <> 'CREDIT_CARD'" in text
          assert 'FOR UPDATE OF t' in text
          assert 'conta.tipo AS conta_tipo' in text
          assert 'Pagamento de fatura do cartão' in text
          assert "tipo = valor < 0 ? 'CREDITO' : 'DEBITO';" in text
          assert text.count('pagamentosCartaoPareados: pagamentosCartao.pareadas') == 3
          PY

      - name: Testar descrições e regra de sinal
        run: |
          node - <<'NODE'
          const normalizar = (descricao) => String(descricao || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase()
            .replace(/[^A-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
          const ehPagamento = (descricao) => {
            const texto = normalizar(descricao);
            if (/\bPAGAMENTO\s+(RECEBIDO|DE\s+FATURA|DA\s+FATURA|FATURA)\b/.test(texto)) return true;
            return /\bPAGAMENTO\s+EM\s+\d{1,2}\s+(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\b/.test(texto);
          };
          for (const descricao of ['Pagamento recebido', 'PAGAMENTO DE FATURA', 'Pagamento da fatura', 'Pagamento em 02 MAI']) {
            if (!ehPagamento(descricao)) throw new Error(`Descrição não reconhecida: ${descricao}`);
          }
          if (ehPagamento('Supermercado')) throw new Error('Falso positivo em compra comum');
          const tipoCartao = (valor) => valor < 0 ? 'CREDITO' : 'DEBITO';
          if (tipoCartao(-100) !== 'CREDITO' || tipoCartao(100) !== 'DEBITO') throw new Error('Regra de sinal do cartão incorreta');
          NODE

      - name: Remover workflow temporário e commitar correção
        run: |
          rm -f .github/workflows/fix-credit-card-payments.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tratar pagamentos de cartão como transferências internas"
          git push origin HEAD:fix/pagamentos-cartao-transferencia-interna
