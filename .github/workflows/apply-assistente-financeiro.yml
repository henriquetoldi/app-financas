name: Aplicar assistente financeiro

on:
  push:
    branches:
      - feat/assistente-financeiro-leitura
    paths:
      - .github/scripts/apply_assistente_financeiro.py
      - .github/workflows/apply-assistente-financeiro.yml

permissions:
  contents: write

jobs:
  aplicar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/assistente-financeiro-leitura
          fetch-depth: 0

      - name: Aplicar alterações
        run: python3 .github/scripts/apply_assistente_financeiro.py

      - name: Checar sintaxe do backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Build do frontend
        run: npm run build

      - name: Validar diff
        run: |
          git diff --check
          git diff -- App.jsx backend-server.js

      - name: Remover automação temporária e publicar alteração final
        run: |
          rm -f .github/scripts/apply_assistente_financeiro.py
          rm -f .github/workflows/apply-assistente-financeiro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adicionar assistente financeiro somente leitura" -m "Cria chat nativo com consultas controladas de gastos, categorias, saldos, contas previstas e compras programadas via OpenAI Responses API, sem ferramentas de escrita."
          git push origin HEAD:feat/assistente-financeiro-leitura
