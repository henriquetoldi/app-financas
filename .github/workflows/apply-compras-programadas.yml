name: Aplicar Compras Programadas

on:
  push:
    branches:
      - agent/compras-programadas-crud
    paths:
      - '.github/scripts/apply_compras_programadas.py'
      - '.github/workflows/apply-compras-programadas.yml'

permissions:
  contents: write

jobs:
  aplicar-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/compras-programadas-crud
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar alterações
        run: python3 .github/scripts/apply_compras_programadas.py

      - name: Validar sintaxe do backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Validar build do frontend
        run: npm run build

      - name: Limpar arquivos temporários e publicar na branch
        run: |
          rm -f .github/scripts/apply_compras_programadas.py
          rm -f .github/workflows/apply-compras-programadas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx backend-server.js .github
          git diff --cached --stat
          git commit -m "Implementar cadastro de Compras Programadas"
          git push origin HEAD:agent/compras-programadas-crud
