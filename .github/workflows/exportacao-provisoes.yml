name: Implementar exportacao analitica de provisoes
on:
  push:
    branches:
      - feat/exportacao-provisoes
jobs:
  implementar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar alteracao
        run: python scripts/patch_exportacao_provisoes.py
      - name: Validar backend
        run: node --check backend-server.js
      - name: Instalar dependencias
        run: npm ci
      - name: Validar build
        run: npm run build
      - name: Validar alteracao
        run: |
          git diff --check
          grep -q "Exportar base analítica" App.jsx
          grep -q "criarXlsxBaseAnaliticaProvisoes" App.jsx
          test "$(git diff --name-only | tr -d '\n')" = "App.jsx"
      - name: Publicar e limpar temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx
          git commit -m "Adicionar exportacao analitica de provisoes"
          git rm .github/workflows/exportacao-provisoes.yml scripts/patch_exportacao_provisoes.py
          git commit -m "chore: remover arquivos temporarios da exportacao de provisoes"
          git push origin HEAD:feat/exportacao-provisoes
