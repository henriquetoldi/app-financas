name: Refinar assistente financeiro

on:
  push:
    branches:
      - feat/assistente-financeiro-leitura
    paths:
      - .github/scripts/refinar_assistente_financeiro.py
      - .github/workflows/refinar-assistente-financeiro.yml

permissions:
  contents: write

jobs:
  refinar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/assistente-financeiro-leitura
          fetch-depth: 0

      - name: Aplicar refinos
        run: python3 .github/scripts/refinar_assistente_financeiro.py

      - name: Checar sintaxe do backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Build do frontend
        run: npm run build

      - name: Validar diff
        run: git diff --check

      - name: Remover automação temporária e publicar refino
        run: |
          rm -f .github/scripts/refinar_assistente_financeiro.py
          rm -f .github/workflows/refinar-assistente-financeiro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refinar privacidade e métricas do assistente" -m "Remove IDs internos dos resultados enviados ao modelo e calcula percentuais contra o gasto total real do período."
          git push origin HEAD:feat/assistente-financeiro-leitura
