name: Exportacao Orcado por periodo

on:
  push:
    branches:
      - feat/exportacao-orcado-periodo

jobs:
  implementar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteracao
        run: python .tmp/exportacao_orcado_periodo.py
      - name: Validar backend
        run: node --check backend-server.js
      - name: Instalar dependencias
        run: npm ci
      - name: Validar build
        run: npm run build
      - name: Validar alteracao
        run: |
          git diff --check
          grep -q "competenciaInicialExportacaoOrcado" App.jsx
          grep -q "Exportar de" App.jsx
          grep -q "quantidadeMeses > 60" App.jsx
          grep -q "registros.push" App.jsx
          test "$(git diff --name-only | tr -d '\n')" = "App.jsx"
      - name: Publicar e limpar temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx
          git commit -m "Permitir exportar Orçado por período"
          git rm .github/workflows/exportacao-orcado-periodo.yml .tmp/exportacao_orcado_periodo.py
          git commit -m "chore: remover temporários da exportação por período"
          git push origin HEAD:feat/exportacao-orcado-periodo
