name: Fix pagination order

on:
  push:
    branches:
      - fix/paginacao-exportacao-deterministica

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paginacao-exportacao-deterministica

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar correção
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend-server.js')
          text = path.read_text()
          old = """     LEFT JOIN conciliacoes ca ON ca.transacao_id = t.id AND ca.status = 'CONFIRMADA'\n     LEFT JOIN provisoes p ON p.id = ca.provisao_id\n     WHERE ${where.join(' AND ')}\n     ORDER BY t.data DESC, t.criado_em DESC\n     LIMIT $${limiteParam} OFFSET $${offsetParam}`,"""
          new = """     LEFT JOIN conciliacoes ca ON ca.transacao_id = t.id AND ca.status = 'CONFIRMADA'\n     LEFT JOIN provisoes p ON p.id = ca.provisao_id\n     WHERE ${where.join(' AND ')}\n     ORDER BY t.data DESC, t.criado_em DESC, t.id DESC\n     LIMIT $${limiteParam} OFFSET $${offsetParam}`,"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Esperava 1 bloco alvo, encontrei {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validar sintaxe do backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar diff
        run: git diff --check

      - name: Guardrail da paginação
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend-server.js').read_text()
          expected = "ORDER BY t.data DESC, t.criado_em DESC, t.id DESC\n     LIMIT $${limiteParam} OFFSET $${offsetParam}`"
          if expected not in text:
              raise SystemExit('Ordenação determinística não encontrada no endpoint paginado')
          PY

      - name: Remover workflow temporário e commitar correção
        run: |
          rm -f .github/workflows/fix-pagination-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrigir ordenação determinística da paginação"
          git push origin HEAD:fix/paginacao-exportacao-deterministica
