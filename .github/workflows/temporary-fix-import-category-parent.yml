name: Temporary fix import category parent

on:
  push:
    branches:
      - fix/importacao-categoria-pai-ambigua

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/importacao-categoria-pai-ambigua
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply SQL alias fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend-server.js')
          content = path.read_text(encoding='utf-8')
          old = "  const wherePai = categoriaPaiId\n    ? `AND categoria_pai_id = $3`\n    : '';"
          new = "  const wherePai = categoriaPaiId\n    ? `AND c.categoria_pai_id = $3`\n    : '';"
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'Esperava 1 ocorrência exata do filtro ambíguo; encontrei {count}')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate exact fix
        run: |
          grep -F 'AND c.categoria_pai_id = $3' backend-server.js
          if grep -F 'AND categoria_pai_id = $3' backend-server.js; then
            echo 'Filtro ambíguo ainda existe' >&2
            exit 1
          fi

      - name: Validate backend syntax
        run: node --check backend-server.js

      - name: Build frontend
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit final hotfix and remove temporary workflow
        run: |
          rm .github/workflows/temporary-fix-import-category-parent.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-server.js .github/workflows/temporary-fix-import-category-parent.yml
          git commit -m 'Corrigir filtro de categoria pai no preview da importação'
          git push origin HEAD:fix/importacao-categoria-pai-ambigua
