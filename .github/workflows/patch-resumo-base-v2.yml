name: Aplicar e validar correção do resumo

on:
  push:
    branches:
      - fix/resumo-base-paginacao-exportacao

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resumo-base-paginacao-exportacao
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar patch focado em App.jsx
        run: python .github/scripts/patch_resumo_base.py

      - name: Validar backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar whitespace
        run: git diff --check

      - name: Smoke do escopo alterado
        run: |
          grep -q "carregarTodasTransacoesFiltradas" App.jsx
          grep -q "Carregando resumo completo da base" App.jsx
          grep -q "await carregarTodasTransacoesFiltradas" App.jsx
          test "$(git diff --name-only | tr '\n' ' ')" = "App.jsx "

      - name: Remover arquivos temporários
        run: |
          git rm .github/workflows/patch-resumo-base.yml
          git rm .github/workflows/patch-resumo-base-v2.yml
          git rm .github/scripts/patch_resumo_base.py

      - name: Commitar patch validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrigir resumo e exportação além da página atual"
          git push origin HEAD:fix/resumo-base-paginacao-exportacao
