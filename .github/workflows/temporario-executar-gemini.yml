name: Temporario validar Gemini gratuito

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporario-executar-gemini.yml'

permissions:
  contents: write

jobs:
  migrar-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistente-gemini-gratis
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar migração
        run: python3 .github/scripts/trocar_assistente_gemini.py

      - name: Verificar backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar escopo e ausência de OpenAI
        run: |
          git diff --check
          ! grep -R "OPENAI_API_KEY\|ASSISTENTE_OPENAI_MODEL\|process.env.OPENAI_MODEL" -n App.jsx backend-server.js
          grep -q "GEMINI_API_KEY" backend-server.js
          grep -q "gemini-2.5-flash-lite" backend-server.js

      - name: Limpar temporários da branch
        run: |
          rm .github/scripts/trocar_assistente_gemini.py
          rm .github/workflows/trocar-assistente-gemini.yml
          arquivos=$(git diff --name-only)
          printf '%s\n' "$arquivos"
          test "$arquivos" = $'App.jsx\nbackend-server.js\n.github/scripts/trocar_assistente_gemini.py\n.github/workflows/trocar-assistente-gemini.yml' || test "$arquivos" = $'.github/scripts/trocar_assistente_gemini.py\n.github/workflows/trocar-assistente-gemini.yml\nApp.jsx\nbackend-server.js'

      - name: Commitar branch validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrar Assistente Financeiro para Gemini gratuito"
          git push origin HEAD:feat/assistente-gemini-gratis
