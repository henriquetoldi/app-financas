name: Implementar exportacao analitica do Orcado

on:
  push:
    branches:
      - feat/exportacao-orcado

jobs:
  implementar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar alteracao
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('App.jsx')
          s = p.read_text()

          helper = r'''
function criarXlsxBaseAnaliticaOrcado(linhas) {
  const cabecalhos = [
    'Ano', 'Mês', 'Competência', 'Descrição', 'Categoria', 'Tipo de despesa', 'Valor previsto',
    'Dia previsto', 'Forma de pagamento', 'Conta / Cartão', 'Banco', 'Tipo da conta',
    'Recorrência', 'Parcela atual', 'Quantidade de parcelas', 'Mês fim', 'Ano fim', 'Observação',
    'Ativa?', 'ID do planejamento', 'ID da categoria', 'ID da conta', 'Grupo de recorrência',
    'Criado em', 'Atualizado em'
  ];
  const todasLinhas = [cabecalhos, ...linhas];
  const sheetRows = todasLinhas.map((linha, rowIndex) => {
    const numeroLinha = rowIndex + 1;
    const cells = linha.map((valor, colIndex) => criarCelulaXlsx(valor, numeroLinha, colIndex, rowIndex === 0 ? 1 : 0)).join('');
    return `<row r="${numeroLinha}">${cells}</row>`;
  }).join('');
  const larguraColunas = cabecalhos.map((cabecalho, index) => {
    const largura = Math.min(44, Math.max(11, ...todasLinhas.slice(0, 501).map((linha) => String(linha[index] ?? '').length + 2)));
    return `<col min="${index + 1}" max="${index + 1}" width="${largura}" customWidth="1"/>`;
  }).join('');
  const ultimaColuna = colunaExcel(cabecalhos.length - 1);
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
  <cols>${larguraColunas}</cols>
  <sheetData>${sheetRows}</sheetData>
  <autoFilter ref="A1:${ultimaColuna}${todasLinhas.length}"/>
</worksheet>`;
  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Base Orçado" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`;
  return criarZipSemCompressao([
    { nome: '[Content_Types].xml', conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { nome: '_rels/.rels', conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { nome: 'xl/workbook.xml', conteudo: workbook },
    { nome: 'xl/_rels/workbook.xml.rels', conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { nome: 'xl/worksheets/sheet1.xml', conteudo: sheet },
    { nome: 'xl/styles.xml', conteudo: styles },
  ]);
}

function nomeArquivoBaseOrcado(mes, ano) {
  return `base_analitica_orcado_${String(ano)}-${String(mes).padStart(2, '0')}.xlsx`;
}

'''

          anchor = 'function baixarArquivo(bytes, nomeArquivo, tipo) {'
          if 'function criarXlsxBaseAnaliticaOrcado' not in s:
              assert anchor in s
              s = s.replace(anchor, helper + anchor, 1)

          fn_start = s.index('function TelaPlanejamentoMensal(')
          state_anchor = '  const [carregando, setCarregando] = useState(false);\n'
          state_pos = s.index(state_anchor, fn_start)
          if 'exportandoOrcado' not in s[fn_start:state_pos + 500]:
              s = s[:state_pos + len(state_anchor)] + '  const [exportandoOrcado, setExportandoOrcado] = useState(false);\n' + s[state_pos + len(state_anchor):]

          func_anchor = '  const excluirPlanejamento = async (item) => {'
          insert_pos = s.index(func_anchor, fn_start)
          export_fn = r'''  const exportarBaseAnaliticaOrcado = () => {
    if (exportandoOrcado) return;
    if (planejamentos.length === 0) {
      mostrarToast('Não há despesas orçadas para exportar com os filtros atuais.');
      return;
    }
    setExportandoOrcado(true);
    try {
      const linhas = planejamentos.map((item) => {
        const conta = contasPlanejamento.find((c) => c.id === item.conta_id);
        const categoria = item.categoria_nome || item.categoria || categorias.find((c) => c.id === item.categoria_id)?.nome || '';
        return [
          Number(item.ano || ano),
          Number(item.mes || mes),
          `${item.ano || ano}-${String(item.mes || mes).padStart(2, '0')}`,
          item.descricao || '',
          categoria,
          item.tipo_despesa || '',
          Number(item.valor_previsto || 0),
          item.dia_previsto === null || item.dia_previsto === undefined || item.dia_previsto === '' ? '' : Number(item.dia_previsto),
          rotuloFormaPagamentoPlanejamento(item.forma_pagamento),
          conta?.nome || item.conta_nome || '',
          conta?.banco || '',
          conta?.tipo || '',
          rotuloRecorrencia(item),
          item.parcela_atual || '',
          item.quantidade_parcelas || '',
          item.mes_fim || '',
          item.ano_fim || '',
          item.observacao || '',
          item.ativa === false ? 'Não' : 'Sim',
          item.id || '',
          item.categoria_id || '',
          item.conta_id || '',
          item.recorrencia_grupo_id || '',
          item.criado_em ? String(item.criado_em) : '',
          item.atualizado_em ? String(item.atualizado_em) : '',
        ];
      });
      const bytes = criarXlsxBaseAnaliticaOrcado(linhas);
      baixarArquivo(bytes, nomeArquivoBaseOrcado(mes, ano), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      mostrarToast(`Base analítica do Orçado exportada com ${planejamentos.length.toLocaleString('pt-BR')} registro(s).`, 'sucesso');
    } catch (error) {
      console.error('Erro ao exportar base analítica do Orçado:', error);
      mostrarToast('Erro ao exportar a base analítica do Orçado. Tente novamente.', 'erro');
    } finally {
      setExportandoOrcado(false);
    }
  };

'''
          if 'const exportarBaseAnaliticaOrcado' not in s[fn_start:insert_pos]:
              s = s[:insert_pos] + export_fn + s[insert_pos:]

          button_anchor = '          <Btn variant="primary" onClick={() => setFormularioAberto(true)}>+ Adicionar despesa planejada</Btn>'
          replacement = '''          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
            <Btn variant="secondary" onClick={exportarBaseAnaliticaOrcado} disabled={exportandoOrcado || planejamentos.length === 0}>{exportandoOrcado ? 'Exportando...' : '📊 Exportar analítico do Orçado'}</Btn>
            <Btn variant="primary" onClick={() => setFormularioAberto(true)}>+ Adicionar despesa planejada</Btn>
          </div>'''
          assert button_anchor in s
          s = s.replace(button_anchor, replacement, 1)

          p.write_text(s)
          PY

      - name: Validar backend
        run: node --check backend-server.js

      - name: Instalar dependencias
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar alteracao
        run: |
          git diff --check
          grep -q "Exportar analítico do Orçado" App.jsx
          grep -q "criarXlsxBaseAnaliticaOrcado" App.jsx
          grep -q "forma_pagamento" App.jsx
          test "$(git diff --name-only | tr -d '\n')" = "App.jsx"

      - name: Publicar e limpar temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx
          git commit -m "Adicionar exportação analítica do Orçado"
          git rm .github/workflows/exportacao-orcado.yml
          git commit -m "chore: remover workflow temporário da exportação do Orçado"
          git push origin HEAD:feat/exportacao-orcado
