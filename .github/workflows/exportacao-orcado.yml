name: Implementar exportacao analitica do Orcado

on:
  push:
    branches:
      - feat/exportacao-orcado

jobs:
  implementar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar alteracao
        run: python scripts/patch_exportacao_orcado.py

      - name: Validar backend
        run: node --check backend-server.js

      - name: Instalar dependencias
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar alteracao
        run: |
          git diff --check
          grep -q "Exportar analítico do Orçado" App.jsx
          grep -q "criarXlsxBaseAnaliticaOrcado" App.jsx
          grep -q "forma_pagamento" App.jsx
          test "$(git diff --name-only | tr -d '\n')" = "App.jsx"

      - name: Publicar e limpar temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx
          git commit -m "Adicionar exportação analítica do Orçado"
          git rm .github/workflows/exportacao-orcado.yml scripts/patch_exportacao_orcado.py
          git commit -m "chore: remover temporários da exportação do Orçado"
          git push origin HEAD:feat/exportacao-orcado
