name: Apply Previsoes Nativas

on:
  push:
    branches:
      - agent/previsoes-nativas
    paths:
      - previsoes-clean.patch
      - .github/workflows/apply-previsoes-nativas.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate patch
        run: git apply --check previsoes-clean.patch

      - name: Apply patch
        run: git apply previsoes-clean.patch

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove temporary files
        run: rm previsoes-clean.patch .github/workflows/apply-previsoes-nativas.yml

      - name: Commit native Previsoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx previsoes-clean.patch .github/workflows/apply-previsoes-nativas.yml
          git commit -m "Implantar tela nativa de Previsões"
          git push
