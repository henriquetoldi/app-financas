name: Apply layout tabs patch

on:
  push:
    branches:
      - feat/layout-abas-internas
    paths:
      - changes/layout-tabs.patch
      - .github/workflows/apply-layout-tabs.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Trigger layout tabs patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/layout-abas-internas
          fetch-depth: 0

      - name: Apply App.jsx patch
        run: |
          git apply --check changes/layout-tabs.patch
          git apply changes/layout-tabs.patch

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx
          git commit -m "Organizar telas densas em abas internas"
          git push origin HEAD:feat/layout-abas-internas
