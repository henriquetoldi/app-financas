name: Implementar linha do tempo do orçamento

on:
  push:
    branches:
      - chatgpt-linha-tempo-orcamento
    paths:
      - .github/workflows/linha-tempo-orcamento.yml

permissions:
  contents: write

jobs:
  implementar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-linha-tempo-orcamento
          fetch-depth: 0

      - name: Inserir linha do tempo mensal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('App.jsx')
          text = path.read_text()

          calc_anchor = "  const limparFiltrosPlanejamento = () => setFiltrosPlanejamento({ tipo: 'TODOS', recorrencia: 'TODAS', categoria: '', periodo: 12 });"
          if text.count(calc_anchor) != 1:
              raise SystemExit(f'Âncora de cálculos encontrada {text.count(calc_anchor)} vezes; abortando.')

          calc_block = r'''  const diasNoMesSelecionado = new Date(Number(ano), Number(mes), 0).getDate();
          const mesSelecionadoEhAtual = Number(mes) === hoje.getMonth() + 1 && Number(ano) === hoje.getFullYear();
          const diaHojeNoMes = mesSelecionadoEhAtual ? hoje.getDate() : null;
          const planejamentosSemDiaPrevisto = planejamentos.filter((item) => item.dia_previsto === null || item.dia_previsto === undefined || item.dia_previsto === '');
          const planejamentosForaDoCalendario = planejamentos.filter((item) => {
            if (item.dia_previsto === null || item.dia_previsto === undefined || item.dia_previsto === '') return false;
            const dia = Number(item.dia_previsto);
            return !Number.isInteger(dia) || dia < 1 || dia > diasNoMesSelecionado;
          });
          const planejamentosComDiaValido = planejamentos.filter((item) => {
            const dia = Number(item.dia_previsto);
            return item.dia_previsto !== null && item.dia_previsto !== undefined && item.dia_previsto !== '' && Number.isInteger(dia) && dia >= 1 && dia <= diasNoMesSelecionado;
          });
          const marcosPagamentoBase = planejamentosComDiaValido.reduce((acc, item) => {
            const dia = Number(item.dia_previsto);
            if (!acc[dia]) acc[dia] = { dia, total: 0, itens: [] };
            acc[dia].total += Number(item.valor_previsto || 0);
            acc[dia].itens.push(item);
            return acc;
          }, {});
          let acumuladoLinhaTempo = 0;
          const marcosPagamento = Object.values(marcosPagamentoBase)
            .sort((a, b) => a.dia - b.dia)
            .map((marco) => {
              acumuladoLinhaTempo += marco.total;
              return { ...marco, acumulado: acumuladoLinhaTempo };
            });
          const totalPlanejadoComDia = marcosPagamento.reduce((soma, marco) => soma + marco.total, 0);
          const totalPlanejadoSemDia = planejamentosSemDiaPrevisto.reduce((soma, item) => soma + Number(item.valor_previsto || 0), 0);
          const maiorMarcoPagamento = marcosPagamento.reduce((maior, marco) => (!maior || marco.total > maior.total ? marco : maior), null);
          const diasReferenciaLinhaTempo = Array.from(new Set([1, 5, 10, 15, 20, 25, diasNoMesSelecionado].filter((dia) => dia <= diasNoMesSelecionado))).sort((a, b) => a - b);
          const percentualDiaLinhaTempo = (dia) => diasNoMesSelecionado <= 1 ? 0 : ((Number(dia) - 1) / (diasNoMesSelecionado - 1)) * 100;

'''
          text = text.replace(calc_anchor, calc_block + calc_anchor)

          ui_anchor = '''        <div style={{ display: 'block', background: 'white', borderRadius: '16px', padding: '22px', boxShadow: '0 2px 10px rgba(15,23,42,0.08)', marginBottom: '18px' }}>
          <h2 style={{ margin: '0 0 6px' }}>Compromissos previstos para os próximos meses</h2>'''
          if text.count(ui_anchor) != 1:
              raise SystemExit(f'Âncora visual encontrada {text.count(ui_anchor)} vezes; abortando.')

          timeline_block = r'''        <div style={{ display: 'block', background: 'white', borderRadius: '16px', padding: '22px', boxShadow: '0 2px 10px rgba(15,23,42,0.08)', marginBottom: '18px' }}>
          <h2 style={{ margin: '0 0 6px' }}>Linha do tempo de pagamentos de {rotuloMesAnoSelecionado}</h2>
          <p style={{ color: '#64748b', marginTop: 0 }}>Organize o caixa vendo em quais dias as despesas planejadas concentram pagamentos. Os valores abaixo respeitam os filtros aplicados nesta tela.</p>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(190px, 1fr))', gap: '12px', margin: '16px 0 18px' }}>
            <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '12px', padding: '14px' }}>
              <div style={{ color: '#64748b', fontSize: '12px', fontWeight: 600 }}>Com dia definido</div>
              <div style={{ color: '#0f172a', fontSize: '20px', fontWeight: 800, marginTop: '4px' }}>{formatarMoeda(totalPlanejadoComDia)}</div>
              <div style={{ color: '#64748b', fontSize: '12px', marginTop: '3px' }}>{planejamentosComDiaValido.length} pagamento(s) em {marcosPagamento.length} marco(s)</div>
            </div>
            <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '12px', padding: '14px' }}>
              <div style={{ color: '#64748b', fontSize: '12px', fontWeight: 600 }}>Maior concentração</div>
              <div style={{ color: '#0f172a', fontSize: '20px', fontWeight: 800, marginTop: '4px' }}>{maiorMarcoPagamento ? formatarMoeda(maiorMarcoPagamento.total) : '—'}</div>
              <div style={{ color: '#64748b', fontSize: '12px', marginTop: '3px' }}>{maiorMarcoPagamento ? `Dia ${maiorMarcoPagamento.dia} · ${maiorMarcoPagamento.itens.length} pagamento(s)` : 'Nenhum marco no mês'}</div>
            </div>
            <div style={{ background: totalPlanejadoSemDia > 0 ? '#fff7ed' : '#f8fafc', border: `1px solid ${totalPlanejadoSemDia > 0 ? '#fed7aa' : '#e2e8f0'}`, borderRadius: '12px', padding: '14px' }}>
              <div style={{ color: '#64748b', fontSize: '12px', fontWeight: 600 }}>Sem dia definido</div>
              <div style={{ color: totalPlanejadoSemDia > 0 ? '#c2410c' : '#0f172a', fontSize: '20px', fontWeight: 800, marginTop: '4px' }}>{formatarMoeda(totalPlanejadoSemDia)}</div>
              <div style={{ color: '#64748b', fontSize: '12px', marginTop: '3px' }}>{planejamentosSemDiaPrevisto.length} item(ns) fora da linha do tempo</div>
            </div>
          </div>

          {marcosPagamento.length === 0 ? (
            <div style={{ background: '#f8fafc', border: '1px dashed #cbd5e1', borderRadius: '12px', padding: '20px', color: '#64748b' }}>
              Nenhuma despesa com dia de pagamento válido foi encontrada em {rotuloMesAnoSelecionado}. Informe o dia previsto nos planejamentos para montar a linha do tempo.
            </div>
          ) : (
            <>
              <div style={{ overflowX: 'auto', paddingBottom: '8px' }}>
                <div style={{ minWidth: '760px', height: '116px', position: 'relative', margin: '2px 8px 0' }}>
                  <div style={{ position: 'absolute', left: '0', right: '0', top: '54px', height: '3px', borderRadius: '999px', background: '#e2e8f0' }} />
                  {diasReferenciaLinhaTempo.map((dia) => (
                    <div key={`ref-${dia}`} style={{ position: 'absolute', left: `${percentualDiaLinhaTempo(dia)}%`, top: '48px', transform: 'translateX(-50%)', textAlign: 'center' }}>
                      <div style={{ width: '1px', height: '14px', background: '#cbd5e1', margin: '0 auto' }} />
                      <div style={{ color: '#94a3b8', fontSize: '11px', marginTop: '4px' }}>dia {dia}</div>
                    </div>
                  ))}
                  {mesSelecionadoEhAtual && diaHojeNoMes <= diasNoMesSelecionado && (
                    <div style={{ position: 'absolute', left: `${percentualDiaLinhaTempo(diaHojeNoMes)}%`, top: '16px', bottom: '22px', width: '1px', background: '#f59e0b', transform: 'translateX(-50%)', zIndex: 1 }}>
                      <span style={{ position: 'absolute', top: '-16px', left: '50%', transform: 'translateX(-50%)', background: '#fffbeb', border: '1px solid #fde68a', color: '#92400e', borderRadius: '999px', padding: '2px 7px', fontSize: '10px', fontWeight: 700, whiteSpace: 'nowrap' }}>Hoje · {diaHojeNoMes}</span>
                    </div>
                  )}
                  {marcosPagamento.map((marco) => (
                    <div key={`marco-${marco.dia}`} title={`Dia ${marco.dia}: ${formatarMoeda(marco.total)} em ${marco.itens.length} pagamento(s)`} style={{ position: 'absolute', left: `${percentualDiaLinhaTempo(marco.dia)}%`, top: '39px', transform: 'translateX(-50%)', zIndex: 2, textAlign: 'center' }}>
                      <div style={{ width: '30px', height: '30px', borderRadius: '50%', background: '#2563eb', border: '4px solid white', boxShadow: '0 0 0 1px #93c5fd', color: 'white', display: 'grid', placeItems: 'center', fontSize: '11px', fontWeight: 800 }}>{marco.dia}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ display: 'flex', gap: '12px', overflowX: 'auto', padding: '2px 2px 10px', scrollSnapType: 'x proximity' }}>
                {marcosPagamento.map((marco) => (
                  <div key={`detalhe-${marco.dia}`} style={{ flex: '0 0 250px', scrollSnapAlign: 'start', border: '1px solid #e2e8f0', borderRadius: '12px', padding: '14px', background: '#ffffff' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', gap: '10px', alignItems: 'baseline' }}>
                      <strong style={{ color: '#1e3a8a', fontSize: '15px' }}>Dia {marco.dia}</strong>
                      <strong style={{ color: '#0f172a', fontSize: '15px', whiteSpace: 'nowrap' }}>{formatarMoeda(marco.total)}</strong>
                    </div>
                    <div style={{ color: '#64748b', fontSize: '11px', margin: '4px 0 10px' }}>Acumulado até este dia: <strong style={{ color: '#334155' }}>{formatarMoeda(marco.acumulado)}</strong></div>
                    <div style={{ display: 'grid', gap: '7px' }}>
                      {marco.itens.map((item) => (
                        <div key={item.id} style={{ display: 'flex', justifyContent: 'space-between', gap: '8px', borderTop: '1px solid #f1f5f9', paddingTop: '7px' }}>
                          <div style={{ minWidth: 0 }}>
                            <div title={item.descricao || 'Despesa planejada'} style={{ color: '#334155', fontSize: '12px', fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.descricao || 'Despesa planejada'}</div>
                            <div style={{ color: '#94a3b8', fontSize: '10px', marginTop: '2px' }}>{item.categoria || 'Sem categoria'} · {rotuloRecorrencia(item)}</div>
                          </div>
                          <span style={{ color: '#475569', fontSize: '11px', fontWeight: 700, whiteSpace: 'nowrap' }}>{formatarMoeda(item.valor_previsto)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {planejamentosSemDiaPrevisto.length > 0 && (
            <div style={{ marginTop: '12px', background: '#fff7ed', border: '1px solid #fed7aa', borderRadius: '10px', padding: '11px 12px', color: '#9a3412', fontSize: '12px' }}>
              <strong>Atenção:</strong> {planejamentosSemDiaPrevisto.length} despesa(s), somando {formatarMoeda(totalPlanejadoSemDia)}, ainda não têm dia previsto e por isso não aparecem nos marcos acima.
            </div>
          )}
          {planejamentosForaDoCalendario.length > 0 && (
            <div style={{ marginTop: '10px', background: '#fef2f2', border: '1px solid #fecaca', borderRadius: '10px', padding: '11px 12px', color: '#991b1b', fontSize: '12px' }}>
              <strong>Revise as datas:</strong> {planejamentosForaDoCalendario.length} despesa(s) têm dia previsto que não existe em {rotuloMesAnoSelecionado} e foram excluídas da linha do tempo para não distorcer seu fluxo de caixa.
            </div>
          )}
        </div>

'''
          text = text.replace(ui_anchor, timeline_block + ui_anchor)
          path.write_text(text)
          PY

      - name: Validar backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar diff
        shell: bash
        run: |
          git diff --check
          grep -q "Linha do tempo de pagamentos" App.jsx
          grep -q "planejamentosSemDiaPrevisto" App.jsx
          grep -q "Acumulado até este dia" App.jsx

      - name: Publicar alteração e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/linha-tempo-orcamento.yml
          git add App.jsx .github/workflows/linha-tempo-orcamento.yml
          git diff --cached --check
          git commit -m "Adicionar linha do tempo mensal ao Orçamento"
          git push origin HEAD:chatgpt-linha-tempo-orcamento
