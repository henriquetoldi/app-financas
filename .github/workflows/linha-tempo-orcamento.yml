name: Implementar linha do tempo do orçamento

on:
  push:
    branches:
      - chatgpt-linha-tempo-orcamento
    paths:
      - .github/workflows/linha-tempo-orcamento.yml

permissions:
  contents: write

jobs:
  implementar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-linha-tempo-orcamento
          fetch-depth: 0

      - name: Aplicar alteração
        run: python scripts/patch_linha_tempo.py

      - name: Validar backend
        run: node --check backend-server.js

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Validar alteração
        run: |
          git diff --check
          grep -q "Linha do tempo de pagamentos" App.jsx
          grep -q "planejamentosSemDiaPrevisto" App.jsx
          grep -q "Acumulado até este dia" App.jsx

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/linha-tempo-orcamento.yml scripts/patch_linha_tempo.py
          git add -A
          git diff --cached --check
          git commit -m "Adicionar linha do tempo mensal ao Orçamento"
          git push origin HEAD:chatgpt-linha-tempo-orcamento
