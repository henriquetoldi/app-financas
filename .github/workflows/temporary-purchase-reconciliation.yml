name: Temporary purchase reconciliation transform

on:
  push:
    branches:
      - agent/conciliar-compras-transacoes
    paths:
      - scripts/temporary-purchase-reconciliation.py
      - .github/workflows/temporary-purchase-reconciliation.yml

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair temporary transformer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/temporary-purchase-reconciliation.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    """",\n    \'remoção da data inventada\',', '    "",\n    \'remoção da data inventada\',')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply transformation
        run: python3 scripts/temporary-purchase-reconciliation.py

      - name: Validate backend syntax
        run: node --check backend-server.js

      - name: Build frontend
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Validate smart purchase guardrails
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const backend = fs.readFileSync('backend-server.js', 'utf8');
          const app = fs.readFileSync('App.jsx', 'utf8');

          const start = backend.indexOf('async function ferramentaBuscarTransacoesCompraRealizada');
          const end = backend.indexOf('async function ferramentaPrepararNovasCompras', start);
          if (start < 0 || end < 0) throw new Error('Ferramenta de busca de transações não encontrada.');
          const body = backend.slice(start, end);
          for (const token of ['INSERT INTO compras_programadas', 'UPDATE compras_programadas', 'DELETE FROM compras_programadas', 'INSERT INTO conciliacoes_compras']) {
            if (body.includes(token)) throw new Error(`Ferramenta Gemini possui escrita direta: ${token}`);
          }
          if (!backend.includes("allowedFunctionNames: ['buscar_transacoes_para_compra_realizada']")) throw new Error('Roteamento obrigatório de compra realizada ausente.');
          if (!backend.includes("app.post('/api/compras-programadas/conciliar-transacao'")) throw new Error('Endpoint de confirmação da associação ausente.');
          if (!backend.includes('CREATE TABLE IF NOT EXISTS conciliacoes_compras')) throw new Error('Tabela de conciliação de compras ausente.');
          if (backend.includes('Data não informada; usada a data atual')) throw new Error('Ainda existe fallback de data inventada.');
          if (!app.includes("tipo === 'CONCILIAR_COMPRA_TRANSACAO'")) throw new Error('Card de seleção de lançamento ausente.');
          console.log('Guardrails OK');
          NODE

      - name: Remove temporary files and commit result
        run: |
          rm -f scripts/temporary-purchase-reconciliation.py .github/workflows/temporary-purchase-reconciliation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx backend-server.js scripts/temporary-purchase-reconciliation.py .github/workflows/temporary-purchase-reconciliation.yml
          git commit -m "Conciliar compras com transações e reforçar Assistente"
          git push
